name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci-seguridad:
    name: Job 1 - CI, Linting, Tests y Seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      # --- FRONTEND (ANGULAR / IONIC) ---
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias Frontend
        working-directory: ./Frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./Frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./Frontend
        run: npm run build -- --configuration=production

      # --- BACKEND (NESTJS) ---
      - name: Instalar dependencias Backend
        working-directory: ./backend
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: ./backend
        run: npx prisma generate

      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint

      - name: Tests unitarios Backend
        working-directory: ./backend
        run: npm test

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      # --- MICROSERVICIO (PYTHON / FASTAPI) ---
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        working-directory: ./Microservicio
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8

      - name: Lint Python (Flake8)
        working-directory: ./Microservicio
        run: flake8 .

      - name: Tests unitarios Python (Pytest)
        working-directory: ./Microservicio
        run: pytest -v

      # --- CONTENEDORES Y ESCANEO TRIVY ---
      - name: Construir imágenes con Docker Compose
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          JWT_SECRET: test_secret_ci
          PYTHON_SERVICE_URL: http://python-service:8000
        run: docker compose build

      - name: Escaneo de vulnerabilidades en imágenes (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

  validacion-iac:
    name: Job 2 - Validación de Infraestructura (Terraform)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false