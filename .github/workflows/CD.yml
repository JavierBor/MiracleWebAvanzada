name: CD Staging

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ main ]

permissions:
  contents: read

jobs:
  cd-staging:
    name: Job 3 - Despliegue Continuo y Health Check en Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Disparar Deploy Hook en Render (Backend)
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL no está configurado en Secrets"
            exit 1
          fi
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Esperar propagación del despliegue en Staging
        run: sleep 45

      - name: Quality Gate - Verificar Salud del Backend (/health)
        run: |
          STAGING_ENDPOINT="${{ vars.STAGING_URL }}/health"
          echo "Verificando salud en: $STAGING_ENDPOINT"
          curl --fail --retry 5 --retry-delay 15 --retry-all-errors "$STAGING_ENDPOINT"