<app-header
  [showHistoryBack]="true"
  badge="ING-2">
</app-header>


<ion-content class="miracle-game-bg">
  <div class="game-wrapper">

    <!-- Título del Juego -->
    <h1 class="game-main-title">Verb Transformer</h1>

    <!-- Píldoras de Estadísticas (Racha, Mejor, Nivel) -->
    <div class="stats-row">
      <div class="stat-pill">
        <span>🔥 Racha: {{ racha }}</span>
      </div>
      <div class="stat-pill">
        <span>🏆 Mejor: {{ mejorRacha }}</span>
      </div>
      <div class="stat-pill">
        <span>Nivel: <strong [ngClass]="{
          'level-normal': nivelActual === 'Normal',
          'level-hard': nivelActual === 'Difícil',
          'level-expert': nivelActual === 'Experto'
        }"><span>{{ nivelActual }}</span></strong></span>
      </div>
    </div>

    <!-- Tarjeta Central con el Verbo -->
    <div class="verb-display-card" [class.card-correct]="feedbackTipo === 'correcto'" [class.card-error]="feedbackTipo === 'error'">
      <span class="verb-word">{{ verboActual?.base }}</span>
      <span class="admin-hint" *ngIf="isAdminMode">
        Respuesta Admin: {{ verboActual?.past?.[0] }}
      </span>
    </div>

    <!-- Mensaje de Feedback (Acierto / Error) -->
    <div class="feedback-banner" *ngIf="feedbackMensaje" [class.text-success]="feedbackTipo === 'correcto'" [class.text-danger]="feedbackTipo === 'error'">
      {{ feedbackMensaje }}
    </div>

    <!-- Formulario de Respuesta (Soporta Enter y Clic) -->
    <form (ngSubmit)="comprobar()" class="interaction-zone">
      <input
        type="text"
        class="verb-input"
        placeholder="Escribe el verbo en pasado simple..."
        [(ngModel)]="respuestaUsuario"
        name="respuestaUsuario"
        autocomplete="off"
      />

      <button type="submit" class="btn-check">
        <span>Comprobar</span>
        <ion-icon name="checkmark-outline" class="check-icon"></ion-icon>
      </button>
    </form>

  </div>
</ion-content>
