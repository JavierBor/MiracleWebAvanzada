<app-header 
  badge="ADMINISTRACIÓN" 
  [showBack]="true" 
  backRoute="/dashboard" 
  backText="Dashboard"
  [isAdminMode]="true"
  (adminModeChange)="onAdminModeChange($event)">
</app-header>

<ion-content class="ion-padding">
  <div class="admin-container">
    
    <!-- Encabezado -->
    <div class="admin-header">
      <h2>Gestión de Usuarios y Accesos</h2>
      <p>Administra los permisos y restringe el acceso de usuarios a la plataforma Miracle.</p>
    </div>

    <!-- Buscador de usuarios -->
    <div class="search-box">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input 
        type="text" 
        placeholder="Buscar usuario por correo o rol..." 
        [(ngModel)]="filtro" 
        class="search-input"
      />
    </div>

    <!-- Estados de Carga y Error -->
    <div *ngIf="cargando" class="state-message">Cargando lista de usuarios...</div>
    <div *ngIf="errorMsg" class="state-message error">{{ errorMsg }}</div>

    <!-- Lista / Tarjetas de Usuarios -->
    <div class="users-list" *ngIf="!cargando && usuariosFiltrados.length > 0">
      <div class="user-card" *ngFor="let u of usuariosFiltrados">
        
        <div class="user-info">
          <div class="avatar-icon" [class.banned]="u.estado === 'RESTRINGIDO'">
            <ion-icon [name]="u.rol === 'ADMIN' ? 'shield-outline' : 'person-outline'"></ion-icon>
          </div>
          <div class="details">
            <span class="email">{{ u.correo }}</span>
            <div class="badges">
              <span class="badge-role" [class.admin]="u.rol === 'ADMIN'">{{ u.rol }}</span>
              <span class="badge-status" [class.banned]="u.estado === 'RESTRINGIDO'">
                {{ u.estado }}
              </span>
            </div>
          </div>
        </div>

        <!-- Botón de Acción (Solo para usuarios con rol USER) -->
        <div class="user-actions" *ngIf="u.rol !== 'ADMIN'">
          <button 
            type="button" 
            class="btn-ban" 
            [class.btn-unban]="u.estado === 'RESTRINGIDO'"
            (click)="toggleBaneo(u)">
            <ion-icon [name]="u.estado === 'RESTRINGIDO' ? 'checkmark-circle-outline' : 'ban-outline'"></ion-icon>
            <span>{{ u.estado === 'RESTRINGIDO' ? 'Desbanear' : 'Banear' }}</span>
          </button>
        </div>

      </div>
    </div>

    <!-- Estado Vacío -->
    <div *ngIf="!cargando && usuariosFiltrados.length === 0" class="empty-state">
      No se encontraron usuarios que coincidan con "{{ filtro }}".
    </div>

  </div>
</ion-content>
