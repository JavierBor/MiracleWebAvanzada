<!-- Componente Header personalizado -->
<app-header></app-header>

<ion-content class="admin-content">
  <div class="alertas-container">
    <div class="alertas-card">
      <h1 class="alertas-title">Enviar Alertas/Avisos</h1>
      <p class="alertas-subtitle">Envío de alertas por correo a usuarios individuales o masivos.</p>

<!-- Selector de Destinatarios (Nativo HTML para evitar bugs de Ionic) -->
      <div class="radio-group-custom">
        <p class="radio-label">Enviar a:</p>
        <div class="radio-options">
          <label class="radio-item">
            <input type="radio" name="tipoEnvio" value="todos" [(ngModel)]="tipoEnvio" />
            Todos los usuarios
          </label>
          <label class="radio-item">
            <input type="radio" name="tipoEnvio" value="individuales" [(ngModel)]="tipoEnvio" />
            Usuarios individuales
          </label>
        </div>
      </div>
      <!-- Campo de Correo (Se oculta dinámicamente si es "todos") -->
      <div class="input-group" *ngIf="tipoEnvio === 'individuales'">
        <label>Correos</label>
        <div class="input-wrapper">
          <input type="email" [(ngModel)]="emailDestino" placeholder="ejemplo@correo.com" class="custom-input" />
        </div>
      </div>

      <!-- Campo de Asunto -->
      <div class="input-group">
        <label>Asunto</label>
        <div class="input-wrapper">
          <input type="text" [(ngModel)]="asuntoAlerta" placeholder="Escriba el asunto del mensaje" class="custom-input" />
        </div>
      </div>

      <!-- Campo de Mensaje -->
      <div class="input-group">
        <label>Mensaje</label>
        <div class="input-wrapper">
          <textarea [(ngModel)]="mensajeAlerta" rows="4" placeholder="Escriba el contenido del mensaje" class="custom-textarea"></textarea>
        </div>
      </div>

      <!-- Botón Enviar -->
      <div class="button-container">
        <button class="btn-enviar" (click)="enviarAlerta()" [disabled]="cargando">
          {{ cargando ? 'Enviando...' : 'Enviar Alertas' }}
        </button>
      </div>
    </div>
  </div>
</ion-content>
