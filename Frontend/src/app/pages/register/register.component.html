<ion-header class="ion-no-border">
  <div class="miracle-navbar">
    <div class="navbar-container">
      <div class="brand-box" routerLink="/">
        <div class="nav-logo-wrapper">
          <img src="logo.png" alt="Miracle Logo" class="logo-img" />
        </div>
        <span class="brand-title">MIRACLE</span>
      </div>
      <div class="account-box">
        <ion-icon name="person-circle-outline" class="account-icon"></ion-icon>
        <span class="account-text">Mi Cuenta</span>
        <ion-icon name="chevron-down-outline" class="chevron-icon"></ion-icon>
      </div>
    </div>
  </div>
</ion-header>

<ion-content class="miracle-bg">
  <div class="main-wrapper">
    
    <div class="register-card">
      <div class="form-header">
        <h1 class="form-title">Registrarse</h1>
        <p class="form-subtitle">Completa tus datos para crear tu cuenta.</p>
      </div>

      <form [formGroup]="registroForm" (ngSubmit)="registrar()" class="full-width-form">
        <ion-grid class="ion-no-padding custom-grid">
          <ion-row>
            <!-- Fila 1: Correo y RUT -->
            <ion-col size="12" size-md="6" class="col-left">
              <div class="field-container">
                <label>Correo electrónico</label>
                <ion-input fill="outline" mode="md" placeholder="nombre@ejemplo.com" formControlName="correo" type="email"></ion-input>
                <span class="error-msg" *ngIf="registroForm.get('correo')?.touched && registroForm.get('correo')?.invalid">
                  Ingresa un correo válido.
                </span>
              </div>
            </ion-col>
            <ion-col size="12" size-md="6" class="col-right">
              <div class="field-container">
                <label>RUT</label>
                <ion-input fill="outline" mode="md" placeholder="12.345.678-9" formControlName="rut"></ion-input>
                <span class="error-msg" *ngIf="registroForm.get('rut')?.touched && registroForm.get('rut')?.invalid">
                  Formato RUT requerido (ej: 12345678-9).
                </span>
              </div>
            </ion-col>

            <!-- Fila 2: Usuario y Región -->
            <ion-col size="12" size-md="6" class="col-left">
              <div class="field-container">
                <label>Nombre de usuario</label>
                <ion-input fill="outline" mode="md" placeholder="tu_usuario" formControlName="username"></ion-input>
                <span class="error-msg" *ngIf="registroForm.get('username')?.touched && registroForm.get('username')?.invalid">
                  Mínimo 3 caracteres.
                </span>
              </div>
            </ion-col>
            <ion-col size="12" size-md="6" class="col-right">
              <div class="field-container">
                <label>Región</label>
                <ion-input fill="outline" mode="md" placeholder="Ej: Valparaíso" formControlName="region"></ion-input>
              </div>
            </ion-col>

            <!-- Fila 3: Comuna -->
            <ion-col size="12" size-md="6" class="col-left">
              <div class="field-container">
                <label>Comuna</label>
                <ion-input fill="outline" mode="md" placeholder="Ej: Viña del Mar" formControlName="comuna"></ion-input>
              </div>
            </ion-col>
            <ion-col size="12" size-md="6" class="col-right">
              <!-- Espacio simétrico -->
            </ion-col>

            <!-- Fila 4: Contraseñas -->
            <ion-col size="12" size-md="6" class="col-left">
              <div class="field-container">
                <label>Contraseña</label>
                <ion-input fill="outline" mode="md" placeholder="••••••••" [type]="showPassword ? 'text' : 'password'" formControlName="password">
                  <ion-icon slot="end" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" (click)="showPassword = !showPassword" style="cursor: pointer; margin-right: 8px;"></ion-icon>
                </ion-input>
              </div>
            </ion-col>
            <ion-col size="12" size-md="6" class="col-right">
              <div class="field-container">
                <label>Confirmar contraseña</label>
                <ion-input fill="outline" mode="md" placeholder="••••••••" [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword">
                  <ion-icon slot="end" [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'" (click)="showConfirmPassword = !showConfirmPassword" style="cursor: pointer; margin-right: 8px;"></ion-icon>
                </ion-input>
              </div>
            </ion-col>
          </ion-row>
        </ion-grid>

        <span class="error-msg-global" *ngIf="registroForm.errors?.['passwordsMismatch'] && registroForm.get('confirmPassword')?.touched">
          Las contraseñas no coinciden.
        </span>

        <div class="terms-container">
          <ion-checkbox formControlName="terminos" mode="md" labelPlacement="end">
            Acepto términos y condiciones
          </ion-checkbox>
        </div>

        <button type="submit" class="btn-submit">Registrarse</button>

        <div class="login-link">
          ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a>
        </div>
      </form>
    </div>

  </div>
</ion-content>
