<ion-header class="ion-no-border">
  <div class="miracle-navbar">
    <div class="navbar-container">
      
      <!-- Izquierda: Botón Historial Anterior (Pestaña anterior) -->
      <div class="back-box" *ngIf="showHistoryBack" (click)="goBack()">
        <ion-icon name="arrow-back-outline" class="nav-icon"></ion-icon>
        <span class="back-text">Anterior</span>
      </div>

      <!-- Izquierda: Botón Volver a Ruta Fija (si showHistoryBack es falso y showBack es verdadero) -->
      <div class="back-box" *ngIf="!showHistoryBack && showBack" [routerLink]="backRoute">
        <ion-icon name="arrow-back-outline" class="nav-icon"></ion-icon>
        <span class="back-text">{{ backText }}</span>
      </div>

      <!-- Espaciador si no hay ningún botón a la izquierda para mantener simetría -->
      <div class="back-placeholder" *ngIf="!showHistoryBack && !showBack"></div>

      <!-- Centro: Logo + MIRACLE + Badges -->
      <div class="brand-box" [routerLink]="(showBack || showHistoryBack) ? null : '/'" [style.cursor]="(showBack || showHistoryBack) ? 'default' : 'pointer'">
        <div class="nav-logo-wrapper">
          <img src="logo.png" alt="Miracle Logo" class="logo-img" />
        </div>
        <span class="brand-title">MIRACLE</span>
        <span class="course-badge" *ngIf="badge">{{ badge }}</span>
        <span class="admin-badge" *ngIf="isAdminMode">ADMIN</span>
      </div>

      <!-- Derecha: Mi Cuenta con Dropdown -->
      <div class="account-wrapper">
        <div class="account-box" (click)="toggleAccountMenu()" [class.active]="showAccountMenu">
          <ion-icon name="person-circle-outline" class="account-icon"></ion-icon>
          <span class="account-text">Mi Cuenta</span>
          <ion-icon name="chevron-down-outline" class="chevron-icon" [class.rotated]="showAccountMenu"></ion-icon>
        </div>

        <!-- Menú desplegable -->
        <div class="dropdown-menu" *ngIf="showAccountMenu">
          <button type="button" class="dropdown-item" (click)="toggleAdminMode()">
            <ion-icon name="shield-checkmark-outline" class="dropdown-icon"></ion-icon>
            <span>{{ isAdminMode ? 'Salir de Modo Admin' : 'Modo Admin' }}</span>
          </button>
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-item logout-item" (click)="cerrarSesion()">
            <ion-icon name="log-out-outline" class="dropdown-icon"></ion-icon>
            <span>Cerrar sesión</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</ion-header>
